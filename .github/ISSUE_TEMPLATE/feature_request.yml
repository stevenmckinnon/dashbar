name: Feature request
description: Suggest something Dashbar could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation behind the idea matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like Dashbar to do
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you tried
  - type: markdown
    attributes:
      value: Dashbar sends nothing off your Mac, so ideas that need an account or a new network request are unlikely to fit.
