<!doctype html>
<!-- The share image (docs/images/og.png, 1200 x 630). Rendered by scripts/render-og.sh; edit here, not the PNG.
     Colours and type are the site's dark theme. The panel is docs/images/overview-dark.png at its 420pt width. -->
<meta charset="utf-8">
<style>
  @font-face { font-family: "Instrument Sans Variable"; font-weight: 400 700; src: url("../../site/node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2") format("woff2"); }
  :root { --ground: oklch(0.16 0.018 215); --ink: oklch(0.95 0.01 215); --muted: oklch(0.74 0.025 215); }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: "Instrument Sans Variable", system-ui, sans-serif; }
  .copy { position: absolute; left: 72px; top: 150px; width: 560px; }
  h1 { margin: 0; font-size: 77px; line-height: 80px; font-weight: 600; letter-spacing: -0.035em; }
  p { margin: 24px 0 0; max-width: 500px; font-size: 28px; line-height: 38px; color: var(--muted); }
  .brand { position: absolute; left: 72px; bottom: 52px; display: flex; align-items: center; gap: 18px; font-size: 28px; font-weight: 600; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .panel { position: absolute; left: 707px; top: 55px; width: 422px; height: 640px; border-radius: 20px; overflow: hidden; border: 1px solid oklch(0.3 0.03 215); }
  .panel img { display: block; width: 420px; height: auto; }
</style>
<div class="copy">
  <h1>Your agents, in the menu bar</h1>
  <p>Claude Code and Codex sessions, plan limits and idle dev servers. Free and open source.</p>
</div>
<div class="brand"><img src="../../docs/images/icon.png" alt=""> Dashbar</div>
