<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2A3A" />
      <stop offset="100%" stop-color="#111822" />
    </linearGradient>

    <!-- Inner Shadow & Highlight Overlay for Squircle -->
    <linearGradient id="borderHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Arc (Dash/Gauge) Glow & Stroke -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <!-- Active Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Glow Filter for Neomorphic Neon Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft 3D Drop Shadow for the macOS Icon Base -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- macOS Style App Squircle Base with Shadow -->
  <rect x="44" y="44" width="424" height="424" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Bevel / Highlight -->
  <rect x="44" y="44" width="424" height="424" rx="104" ry="104" fill="none" stroke="url(#borderHighlight)" stroke-width="3" />

  <!-- The "Dash" (Semi-circular Gauge Arc) -->
  <!-- Center is at X=256, Y=265. Radius=100. Path goes from left to right in a half-circle -->
  <!-- Adding a glowing backdrop first -->
  <path d="M 156,265 A 100,100 0 0,1 356,265" fill="none" stroke="#22D3EE" stroke-width="14" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />
  <path d="M 156,265 A 100,100 0 0,1 356,265" fill="none" stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- The "Bar" (Active Utility / Progress Bar) Area -->
  <!-- Dark container Track -->
  <rect x="136" y="315" width="240" height="34" rx="17" ry="17" fill="#0C131C" stroke="#1D2E41" stroke-width="2" />
  
  <!-- Glow behind the Active Bar Segment -->
  <rect x="141" y="320" width="160" height="24" rx="12" ry="12" fill="url(#barGrad)" opacity="0.4" filter="url(#glow)" />
  
  <!-- Active Bar Segment -->
  <rect x="141" y="320" width="160" height="24" rx="12" ry="12" fill="url(#barGrad)" />

</svg>